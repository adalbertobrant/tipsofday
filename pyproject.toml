[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tipsofday"
version = "0.1.0"
description = "Daily crypto briefing generated by a local, open-weight LLM. Information, not investment advice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "tipsofday contributors" }]
keywords = ["crypto", "news", "llm", "open-weight", "local", "privacy", "ollama"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "trafilatura>=1.8",
]

[project.optional-dependencies]
license = ["cryptography>=42"]
llamacpp = ["llama-cpp-python>=0.2.70"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "cryptography>=42"]

[project.scripts]
tipsofday = "tipsofday:main"

[project.urls]
Homepage = "https://github.com/tipsofday/tipsofday"
Repository = "https://github.com/tipsofday/tipsofday"
Issues = "https://github.com/tipsofday/tipsofday/issues"

[tool.setuptools]
py-modules = ["tipsofday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
