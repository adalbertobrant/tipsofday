[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tipsofday"
version = "0.1.0"
description = "Daily crypto briefing generated by a local, open-weight LLM. Information, not investment advice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "tipsofday contributors" }]
keywords = ["crypto", "news", "llm", "open-weight", "local", "privacy", "ollama"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "trafilatura>=1.8,<3",
]

[project.optional-dependencies]
license = ["cryptography>=42,<52"]
llamacpp = ["llama-cpp-python>=0.2.70,<1"]
dev = ["pytest>=8,<10", "ruff>=0.5,<1", "mypy>=1.10,<2", "cryptography>=42,<52", "build>=1"]

[project.scripts]
tipsofday = "tipsofday:main"

[project.urls]
Homepage = "https://github.com/adalbertobrant/tipsofday"
Repository = "https://github.com/adalbertobrant/tipsofday"
Issues = "https://github.com/adalbertobrant/tipsofday/issues"

[tool.setuptools]
py-modules = ["tipsofday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
